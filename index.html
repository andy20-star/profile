<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Profile Card</title>
    <!-- Menghubungkan file HTML dengan file CSS eksternal -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Kartu Kontainer Utama -->
    <div class="profile-card">

        <!-- Badge Status Aktif -->
        <span class="badge">🟢 Ready to Code</span>

        <!-- Foto Profil -->
        <img src="pokemon-legends-arceus-akari-rei-4k-wallpaper-uhdpaper.com-145@1@f.jpg" alt="Foto Profil" class="profile-img">

        <!-- Nama & Peran -->
        <h1>Ren_amane</h1>
        <p class="role">progamer game & game artist</p>

        <!-- Bio / Deskripsi Singkat -->
        <p class="bio">Suka bikin art gambar, hobi ngoding sambil dengar musik. 🎧</p>

        <!-- Tombol Aksi / Media Sosial -->
        <div class="social-links">
            <a href="https://github.com/andy20-star" class="btn github" target="_blank" rel="noopener noreferrer">GitHub</a>
        </div>

    </div>

</body>
</html>
